# Gold standard MAG library experiment config.

# shellcheck source=/dev/null
CONFIG_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
# shellcheck source=/dev/null
source "$CONFIG_DIR/binning_base.conf"

EXPERIMENT_NAME="gold_standard_mag_library"
BINNER="metawrap"

ASSEMBLIES=("${PROJECT_ASSEMBLY_NAMES[@]}")
TARGET_SAMPLES=("${PROJECT_SAMPLE_NAMES[@]}")

# Gold-standard style pooled reads across selected read samples.
SET_SUFFIX="gold_standard"
COBINNING_MODE=1
READ_SAMPLES=("${PROJECT_READ_SAMPLE_NAMES[@]}")

OUTPUT_ROOT="${DATA_DIR}/binning_outputs/gold_standard_mag_library"
