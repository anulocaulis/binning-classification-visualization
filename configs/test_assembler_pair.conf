# Test config: metaspades (metawrap) + metaspades_hybrid (vamb) on S1 only
# Purpose: Verify both binner types complete successfully before full run

# shellcheck source=/dev/null
CONFIG_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
# shellcheck source=/dev/null
source "$CONFIG_DIR/binning_base.conf"

EXPERIMENT_NAME="test_assembler_pair"
BINNER="metawrap"

# Test subset: just these two assemblers
ASSEMBLIES=(metaspades metaspades_hybrid)
TARGET_SAMPLES=(S1)

SET_SUFFIX="test_pair"
COBINNING_MODE=0

OUTPUT_ROOT="${DATA_DIR}/binning_outputs/binning_modules_test/test_assembler_pair"
