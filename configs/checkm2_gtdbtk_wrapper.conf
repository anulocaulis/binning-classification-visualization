# Config for scripts/run_checkm2_gtdbtk_from_config.sh

BASE_DIR="/storage/biology/projects/miller-lowry/beitner"
WORK_DIR="${BASE_DIR}/binning-classification-wrapper"
DATA_DIR="${BASE_DIR}/data"

# Target selectors used by --sample-number / --assembly-number.
SAMPLES=(S1 S2 S5)
ASSEMBLIES=(idbaud megahit metaspades flye metamdbg metaspades_hybrid)

# set_name = <assembly>_<sample_lower>_<SET_SUFFIX>
SET_SUFFIX="metawrap_bins_refined"

# Placeholder keys supported: {data_dir}, {assembly}, {sample}, {sample_lower}, {set_suffix}
BIN_DIR_TEMPLATE="{data_dir}/binning_outputs/refined_bins/{assembly}_{sample_lower}_{set_suffix}/fast_mode_bins"

CHECKM2_SCRIPT="${WORK_DIR}/scripts/checkm2_single_set.sh"
GTDBTK_SCRIPT="${WORK_DIR}/scripts/gtdbtk_single_set.sh"

CHECKM2_OUT_ROOT="${DATA_DIR}/binning_outputs/checkm2_single_runs"
GTDBTK_OUT_ROOT="${DATA_DIR}/binning_outputs/gtdbtk_single_runs"
COMBINED_TSV="${GTDBTK_OUT_ROOT}/summary/gtdbtk_checkm2_combined_bins.tsv"

CHECKM2_CONTAINER="${WORK_DIR}/containers/checkm2-fastani-drep.sif"
CHECKM2_DB="${BASE_DIR}/databases/CheckM2_database/uniref100.KO.1.dmnd"

GTDBTK_CONTAINER="${WORK_DIR}/containers/classification.sif"
GTDBTK_DB="${BASE_DIR}/databases/gtdbtk_db"

HQ_COMPLETENESS=90
HQ_CONTAMINATION=5
MQ_COMPLETENESS=50
MQ_CONTAMINATION=10

# Set to 1 to classify HQ bins only in GTDB-Tk stage.
GTDBTK_HQ_ONLY=0
