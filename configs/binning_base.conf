# Shared base config for binning experiment wrappers.

# shellcheck source=/dev/null
CONFIG_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
# shellcheck source=/dev/null
source "$CONFIG_DIR/configs_master.conf"

BASE_DIR="${PROJECT_BASE_DIR}"
WORK_DIR="${PROJECT_WORK_DIR}"
DATA_DIR="${PROJECT_DATA_DIR}"

# Select default binner for this config: metawrap or vamb.
BINNER="metawrap"

# Shared script paths.
METAWRAP_BINNER_SCRIPT="${WORK_DIR}/binning/metawrap_binner_single_set.sh"
VAMB_BINNER_SCRIPT="${WORK_DIR}/binning/vamb_binner_single_set.sh"

# Shared container paths.
METAWRAP_CONTAINER="${WORK_DIR}/containers/metawrap.sif"
QC_CONTAINER="${WORK_DIR}/containers/qc_tools_miniconda.sif"
VAMB_CONTAINER="${WORK_DIR}/containers/vamb.sif"

# Resource knobs.
CPUS=32
MEM_GB=360
MIN_CONTIG_LEN=2000

# Naming suffix used to build set names.
SET_SUFFIX="bins"

# Template placeholders supported: {assembly} {sample} {sample_lower} {set_suffix}
ASSEMBLY_TEMPLATE="${PROJECT_ASSEMBLY_TEMPLATE}"
SHORT_READ_TEMPLATE="${PROJECT_SHORT_READ_TEMPLATE}"
LONG_READ_TEMPLATE="${PROJECT_LONG_READ_TEMPLATE}"

ASSEMBLIES=("${PROJECT_ASSEMBLY_NAMES[@]}")
TARGET_SAMPLES=("${PROJECT_SAMPLE_NAMES[@]}")

# If COBINNING_MODE=1, reads come from READ_SAMPLES array for every target sample.
# If COBINNING_MODE=0, each target sample uses only its own reads.
COBINNING_MODE=0
# If COBINNING_MODE=1, short reads are pooled from READ_SAMPLES_SHORT and
# long reads are pooled from READ_SAMPLES_LONG.
READ_SAMPLES_SHORT=("${PROJECT_SHORT_READ_SAMPLE_NAMES[@]}")
READ_SAMPLES_LONG=("${PROJECT_LONG_READ_SAMPLE_NAMES[@]}")
