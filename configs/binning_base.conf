# Shared base config for binning experiment wrappers.

BASE_DIR="/storage/biology/projects/miller-lowry/beitner"
WORK_DIR="${BASE_DIR}/binning-classification-wrapper"
DATA_DIR="${BASE_DIR}/data"

# Select default binner for this config: metawrap or vamb.
BINNER="metawrap"

# Shared script paths.
METAWRAP_BINNER_SCRIPT="${WORK_DIR}/scripts/metawrap_binner_single_set.sh"
VAMB_BINNER_SCRIPT="${WORK_DIR}/scripts/vamb_binner_single_set.sh"

# Shared container paths.
METAWRAP_CONTAINER="${WORK_DIR}/containers/metawrap.sif"
QC_CONTAINER="${WORK_DIR}/containers/qc_tools_miniconda.sif"
VAMB_CONTAINER="${WORK_DIR}/containers/vamb.sif"

# Resource knobs.
CPUS=32
MEM_GB=360
MIN_CONTIG_LEN=2000

# Naming suffix used to build set names.
SET_SUFFIX="bins"

# Template placeholders supported: {assembly} {sample} {sample_lower} {set_suffix}
ASSEMBLY_TEMPLATE="${DATA_DIR}/assemblies/{assembly}/{sample_lower}.assembly.fasta"
SHORT_READ_TEMPLATE="${DATA_DIR}/{sample}/short_reads.fastq.gz"
LONG_READ_TEMPLATE="${DATA_DIR}/{sample}/long_reads.fastq.gz"

# If COBINNING_MODE=1, reads come from READ_SAMPLES array for every target sample.
# If COBINNING_MODE=0, each target sample uses only its own reads.
COBINNING_MODE=0
READ_SAMPLES=()
