# Master project config for dataset-specific paths and shared inventory.
# Edit this file when the project root, data layout, or sample/assembly sets change.

PROJECT_BASE_DIR="/storage/biology/projects/miller-lowry/beitner"
PROJECT_WORK_DIR="${PROJECT_BASE_DIR}/binning-classification-wrapper"
PROJECT_DATA_DIR="${PROJECT_BASE_DIR}/data"

# Canonical project inventory shared by the binning and classification wrappers.
PROJECT_SAMPLE_NAMES=(S1 S2 S3 S4 S5 S6 S7 S8 S9 S10 S11 S12)
PROJECT_ASSEMBLY_NAMES=(idbaud megahit metaspades flye metamdbg metaspades_hybrid)
PROJECT_READ_SAMPLE_NAMES=(S1 S2 S3 S4 S5 S6 S7 S8 S9 S10 S11 S12)

# Canonical input templates.
PROJECT_ASSEMBLY_TEMPLATE="${PROJECT_DATA_DIR}/assemblies/{assembly}/{sample_lower}.assembly.fasta"
PROJECT_SHORT_READ_TEMPLATE="${PROJECT_DATA_DIR}/{sample}/short_reads.fastq.gz"
PROJECT_LONG_READ_TEMPLATE="${PROJECT_DATA_DIR}/{sample}/long_reads.fastq.gz"

# Plotting pipeline dataset-level roots.
PROJECT_PLOTTING_ROOT="${PROJECT_BASE_DIR}/assembly_stats"
PROJECT_QC_TOOLS_CONTAINER="${PROJECT_BASE_DIR}/Lowry-assemblies/containers/qc_tools_miniconda.sif"

# Plotting input roots.
PROJECT_FULL_ASSEMBLIES_DIR="${PROJECT_DATA_DIR}/assemblies"
PROJECT_GE1000_ASSEMBLIES_DIR="${PROJECT_DATA_DIR}/assemblies"
PROJECT_SUBSAMPLING_DIR="${PROJECT_DATA_DIR}/subsampling"
PROJECT_SEQUENCING_RUNS_DIR="${PROJECT_DATA_DIR}"

# Plotting expected counts (set to 0 to disable a check).
PROJECT_EXPECTED_FULL_SAMPLE_COUNT=${#PROJECT_SAMPLE_NAMES[@]}
PROJECT_EXPECTED_SUBSAMPLE_SAMPLE_COUNT=0
PROJECT_EXPECTED_ASSEMBLER_COUNT=${#PROJECT_ASSEMBLY_NAMES[@]}
