# Subsampling experiment config.

# shellcheck source=/dev/null
CONFIG_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
# shellcheck source=/dev/null
source "$CONFIG_DIR/binning_base.conf"

EXPERIMENT_NAME="subsampling_experiment"
BINNER="vamb"

# Edit these for your subsampling matrix.
ASSEMBLIES=(megahit)
TARGET_SAMPLES=(S1)

SET_SUFFIX="subsample"
COBINNING_MODE=0

# Example for custom subsampled reads path; adjust to your layout.
# SHORT_READ_TEMPLATE="${DATA_DIR}/subsampled/{sample}/{sample_lower}.subsample.fastq.gz"

OUTPUT_ROOT="${DATA_DIR}/binning_outputs/subsampling_experiment"
