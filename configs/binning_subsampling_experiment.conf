# Subsampling experiment config.

# shellcheck source=/dev/null
CONFIG_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
# shellcheck source=/dev/null
source "$CONFIG_DIR/binning_base.conf"

EXPERIMENT_NAME="subsampling_experiment"
BINNER="metawrap"

# 11 subsample datasets x 4 assemblies = 44 binning sets.
ASSEMBLIES=(flye metamdbg metaspades_hybrid)
TARGET_SAMPLES=(
	S1_subsample_1
	S1_subsample_2
	S1_subsample_3
	S1_subsample_4
	S1_subsample_5
	S1_subsample_6
	S1_subsample_7
	S1_subsample_8
	S1_subsample_9
	S1_subsample_10
	S1_subsample_11
)

SET_SUFFIX="subsample"
COBINNING_MODE=1

# Pool all canonical Illumina reads and include only the matching subsample long read.
READ_SAMPLES_SHORT=("${PROJECT_SHORT_READ_SAMPLE_NAMES[@]}")
READ_SAMPLES_LONG=("__TARGET_SAMPLE__")

# Subsample assemblies and long reads live under data/subsampling.
ASSEMBLY_TEMPLATE="${DATA_DIR}/subsampling/{sample}/assembly.{assembly}/assembly.fasta"
SHORT_READ_TEMPLATE="${PROJECT_SHORT_READ_TEMPLATE}"
LONG_READ_TEMPLATE="${DATA_DIR}/subsampling/{sample}_long_reads_filtered.fastq.gz"

# Assembly-specific override for metamdbg FASTA filename.
ASSEMBLY_TEMPLATE_METAMDBG="${DATA_DIR}/subsampling/{sample}/assembly.metamdbg/metamdbg.contigs.fasta"

OUTPUT_ROOT="${DATA_DIR}/binning_outputs/binning_modules_20260824/subsampling_experiment"
